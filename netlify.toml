[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[redirects]]
  from = "/api/babylovegrowth"
  to = "/.netlify/functions/babylovegrowth"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/tonelab"
  to = "/tonelab.html"
  status = 301

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 301

# Private metrics dashboard. The gate covers the API endpoint as well as the
# page — gating only the page would leave /api/metrics curl-able.
[[redirects]]
  from = "/api/metrics"
  to = "/.netlify/functions/metrics"
  status = 200

# Rewrite, not a 301. The login form POSTs back to whatever URL you are on,
# and a 301 turns a POST into a GET — you would log in and land straight back
# on the password form.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[edge_functions]]
  path = "/dashboard"
  function = "dashboard-gate"

[[edge_functions]]
  path = "/dashboard.html"
  function = "dashboard-gate"

[[edge_functions]]
  path = "/api/metrics"
  function = "dashboard-gate"
